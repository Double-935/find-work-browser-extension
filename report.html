<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Work 日报</title><link rel="stylesheet" href="style.css"><main><h1>求职机会日报</h1><p id="summary"></p><div class="row-actions"><button id="scan">立即扫描</button><button id="settings" class="secondary">设置</button><button id="export" class="secondary">导出本机数据</button></div><h2>今日可投岗位</h2><p class="muted">仅展示具体职位页可读取职责、地点或届别以及投递入口的岗位。分数为规则匹配，需自行判断。</p><div id="verified"></div><h2>待用户确认</h2><div id="leads"></div><h2>我的待投递与进度</h2><div id="todo"></div><h3>手动加入我想投的岗位</h3><p class="muted">你自己选定的岗位直接进入待投递。若招聘页无法自动读取，请粘贴具体 JD 以便准备简历。</p><div class="grid"><label>公司<input id="manualCompany"></label><label>具体岗位<input id="manualTitle"></label></div><label>岗位网址<input id="manualUrl" type="url" placeholder="https://..."></label><label>岗位 JD（可稍后补）<textarea id="manualJd" rows="5"></textarea></label><button id="addManual">加入待投递</button><p id="manualMessage" role="status"></p><h2>本周能力雷达</h2><div id="radar"></div><h2>扫描记录</h2><div id="log"></div></main><dialog id="resumeDialog"><h2 id="dialogTitle">定制简历</h2><p>复制提示词到你已有的 AI 工具。将生成内容粘贴回下方，核对事实后确认。插件不会代投。</p><button id="copyPrompt">复制生成提示词</button><label>简历草稿<textarea id="draft" rows="17"></textarea></label><div class="row-actions"><button id="saveDraft">保存草稿</button><button id="confirmDraft">确认草稿</button><button id="downloadDraft" class="secondary">下载 Markdown</button><button id="closeDialog" class="secondary">关闭</button></div><p id="draftMessage" role="status"></p></dialog><script src="report.js"></script></html>
